[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maestro"
version = "1.0.0"
description = "AI agent that reads machine fault logs, searches maintenance manuals and writes shift reports"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Abdulrahim Ramadan", email = "Abdalrhim19991@gmail.com" }]
dependencies = [
    "openai>=1.40",
    "python-dotenv>=1.0",
    "chromadb>=0.5",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/abdulrahim-ramadan/maestro-agent"
Repository = "https://github.com/abdulrahim-ramadan/maestro-agent"
Issues = "https://github.com/abdulrahim-ramadan/maestro-agent/issues"
Author = "https://abdulrahim-ramadan.com"

[project.scripts]
maestro = "maestro.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: tests that load the embedding model or touch a vector store"]
